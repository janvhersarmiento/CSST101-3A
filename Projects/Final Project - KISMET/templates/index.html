<!DOCTYPE html>
<html>
<head>
    <title>Student Risk Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f8f9fa;
            color: #2c3e50;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 50px;
            text-align: center;
            color: #1a1a1a;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .chart-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .chart-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .prediction-result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

        .prediction-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .prediction-value {
            font-size: 24px;
            font-weight: 700;
        }

        .risk-low {
            color: #27ae60;
        }

        .risk-moderate {
            color: #f39c12;
        }

        .risk-high {
            color: #e74c3c;
        }

        .helper-text {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .section {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Risk Prediction System</h1>

        <!-- Dashboard Section -->
        <div class="section">
            <div class="section-title">Model Performance Overview</div>
            <div class="chart-container">
                <img src="{{ url_for('static', filename=dashboard_image) }}" alt="Risk Distribution">
            </div>
        </div>

        <!-- Prediction Form -->
        <div class="section">
            <div class="section-title">Try the Model</div>
            
            <form method="post">
                <div class="form-group">
                    <label for="attendance">Attendance (%)</label>
                    <input type="number" id="attendance" name="attendance" min="0" max="100" step="0.1" required>
                    <div class="helper-text">Enter percentage between 0-100</div>
                </div>

                <div class="form-group">
                    <label for="quiz">Quiz Average</label>
                    <input type="number" id="quiz" name="quiz" min="0" max="100" step="0.1" required>
                    <div class="helper-text">Enter average quiz score</div>
                </div>

                <div class="form-group">
                    <label for="engagement">Engagement Level</label>
                    <input type="number" id="engagement" name="engagement" min="0" max="1" step="1" required>
                    <div class="helper-text">0 = Low engagement, 1 = High engagement</div>
                </div>

                <button type="submit" class="submit-btn">Predict Risk Level</button>
            </form>

            {% if prediction %}
            <div class="prediction-result">
                <div class="prediction-label">Predicted Risk Level</div>
                <div class="prediction-value 
                    {% if prediction == 'Low' %}risk-low
                    {% elif prediction == 'Moderate' %}risk-moderate
                    {% elif prediction == 'High' %}risk-high
                    {% endif %}">
                    {{ prediction }}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
